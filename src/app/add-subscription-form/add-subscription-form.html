<form class="add-form" (submit)="add($event)" novalidate aria-labelledby="add-heading">
  <h3 id="add-heading" class="visually-hidden">Add a subscription</h3>
  <div class="form-grid">
    <div class="field-group">
      <app-subscription-field
        label="Subscription name"
        [errorText]="errorText('name')"
        [hiddenLabel]="true"
        controlId="subscription-name"
      >
        <input
          subscriptionControl
          #nameInput
          type="text"
          autocomplete="off"
          placeholder="Name e.g. Spotify"
          [formField]="addForm.name"
        />
      </app-subscription-field>
    </div>
    <div class="field-group">
      <app-subscription-field
        label="Price"
        [errorText]="errorText('price')"
        [hiddenLabel]="true"
        controlId="subscription-price"
      >
        <input
          subscriptionControl
          type="number"
          inputmode="decimal"
          step="0.01"
          placeholder="Price"
          [formField]="addForm.price"
        />
      </app-subscription-field>
    </div>
    <div class="field-group">
      <app-subscription-field
        label="Billing frequency"
        [errorText]="errorText('billingFrequency')"
        [hiddenLabel]="true"
        controlId="subscription-billing"
      >
        <select
          subscriptionControl
          [class.is-empty]="!addModel().billingFrequency"
          [formField]="addForm.billingFrequency"
        >
          <option value="" disabled>Billing</option>
          @for (billingFrequency of billingFrequencies; track billingFrequency) {
            <option [value]="billingFrequency">
              {{ billingFrequencyLabels[billingFrequency] }}
            </option>
          }
        </select>
      </app-subscription-field>
    </div>
    <div class="field-group">
      <app-subscription-field
        label="Currency"
        [errorText]="errorText('currency')"
        [hiddenLabel]="true"
        controlId="subscription-currency"
      >
        <select
          subscriptionControl
          [class.is-empty]="!addModel().currency"
          [formField]="addForm.currency"
        >
          <option value="" disabled>Currency</option>
          @for (currency of currencies; track currency) {
            <option [value]="currency">{{ currency }}</option>
          }
        </select>
      </app-subscription-field>
    </div>
    <div class="field-group">
      <label class="visually-hidden" for="subscription-reason">Reason</label>
      <select id="subscription-reason" [formField]="addForm.reason">
        @for (reason of reasons; track reason) {
          <option [value]="reason">{{ reason }}</option>
        }
      </select>
    </div>
  </div>
  <app-toast />
  <button type="submit" class="primary">Add subscription</button>
  <p class="usage-note">Usage is estimated from your reason. You can refine it in the review.</p>
</form>
