<article class="subscription-card" [attr.aria-label]="subscription().name">
  @if (editing()) {
    <form (submit)="done($event)" novalidate [attr.aria-label]="'Edit ' + subscription().name">
      <div class="edit-fields">
        <label [for]="'edit-name-' + subscription().id">Subscription name</label>
        <input
          #nameInput
          [id]="'edit-name-' + subscription().id"
          type="text"
          autocomplete="off"
          [formField]="editForm.name"
        />
        <label [for]="'edit-price-' + subscription().id">Price</label>
        <input
          [id]="'edit-price-' + subscription().id"
          type="number"
          inputmode="decimal"
          step="0.01"
          [formField]="editForm.price"
        />
        <label [for]="'edit-billing-' + subscription().id">Billing frequency</label>
        <select [id]="'edit-billing-' + subscription().id" [formField]="editForm.billingFrequency">
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
        <label [for]="'edit-currency-' + subscription().id">Currency</label>
        <select [id]="'edit-currency-' + subscription().id" [formField]="editForm.currency">
          @for (currency of currencies; track currency) {
            <option [value]="currency">{{ currency }}</option>
          }
        </select>
        <label [for]="'edit-reason-' + subscription().id">Reason</label>
        <select [id]="'edit-reason-' + subscription().id" [formField]="editForm.reason">
          @for (reason of reasons; track reason) {
            <option [value]="reason">{{ reason }}</option>
          }
        </select>
      </div>
      <p class="yearly">Annual cost {{ annualCostText() }}</p>
      <button type="submit" class="done">Done</button>
    </form>
  } @else {
    <div class="card-top">
      <span class="monogram" aria-hidden="true">{{ monogram(subscription().name) }}</span>
      <span class="card-price"
        >{{ priceText() }}
        <small>/ {{ billingUnitLabel(subscription().billingFrequency) }}</small>
      </span>
    </div>
    <h3>
      <button
        #cardButton
        type="button"
        class="card-button"
        (click)="opened.emit()"
      >
        {{ subscription().name }}
      </button>
    </h3>
    <p class="yearly">Annual cost {{ annualCostText() }}</p>
    <div class="card-details">
      <span class="reason">Reason: {{ subscription().reason }}</span>
      <span class="usage">Usage: {{ subscription().usage }}</span>
    </div>
  }
</article>
